[phases.setup]
cmds = [
    "apt-get update",
    "apt-get install -y curl wget ca-certificates libpng-dev libonig-dev libxml2-dev zip unzip default-mysql-client",
    "mkdir -p /etc/ssl/certs/tidb"
]

[phases.install]
cmds = [
    "wget -q -O /etc/ssl/certs/tidb/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem",
    "update-ca-certificates --fresh",
    "composer install --no-dev --optimize-autoloader --ignore-platform-reqs"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"